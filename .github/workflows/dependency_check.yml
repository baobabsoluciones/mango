name: Dependency Audit Privado Baobab (Monorepo OSV Engine - Fixed)

on:
  push:
    branches:
      - feature/dependabot_test
  # 1. Detección dinámica de carpetas
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          FOLDERS=$(find . -name "pyproject.toml" -not -path "*/.*" -exec dirname {} + | sed 's|./||' | jq -R -s -c 'split("\n")[:-1]')
          echo "folders=$FOLDERS" >> $GITHUB_OUTPUT
  # 2. Análisis paralelo
  analyze:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.setup-matrix.outputs.folders) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          pipx install pip-audit > /dev/null
          curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Run Audit for ${{ matrix.service }}
        id: audit
        continue-on-error: true
        env:
          AUDIT_PASS: ${{ secrets.AUDIT_PASSWORD }}
        run: |
          DIR_NAME="${{ matrix.service }}"
          SAFE_NAME=$(echo "$DIR_NAME" | sed 's|/|_|g')
          REPORT_PATH="$GITHUB_WORKSPACE/${SAFE_NAME}_report.txt"
          
          # Creamos el script de Python
          cat << 'EOF' > audit_script.py
          import tomllib, re, subprocess, os, sys
          
          def audit_pkg(name, ver, detailed=False):
              fname = f'tmp_{name}.txt'
              with open(fname, 'w') as f: f.write(f'{name}=={ver}')
              args = ['pip-audit', '--vulnerability-service', 'osv', '-r', fname, '--format', 'columns']
              if detailed: args.append('--desc=on')
              res = subprocess.run(args, capture_output=True, text=True)
              if os.path.exists(fname): os.remove(fname)
              return res.stdout if '---' in res.stdout else ''
          try:
              with open('pyproject.toml', 'rb') as f: data = tomllib.load(f)
              deps = data.get('project', {}).get('dependencies', [])
              for group in data.get('project', {}).get('optional-dependencies', {}).values(): deps.extend(group)
              
              res_c, found = "", False
              for d in deps:
                  match = re.search(r'([a-zA-Z0-9_-]+)\s*[>=|==]+\s*([0-9.]+)', d)
                  if match:
                      n, v = match.group(1), match.group(2)
                      r_out = audit_pkg(n, v, False)
                      if r_out.strip():
                          found = True
                          res_c += f'ALERTA en {n} v{v}:\n{r_out}\n'
              
              if found:
                  with open('temp_res.txt', 'w') as f: f.write(res_c)
                  sys.exit(1)
          except Exception as e:
              sys.exit(0)
          EOF
          cd "$DIR_NAME"
          cp ../audit_script.py .
          
          VULNS_FOUND=false
          # --- PARTE 1: MÍNIMOS ---
          # Ejecutamos y verificamos si existe temp_res.txt dentro de la carpeta
          python3 audit_script.py || {
            if [ -f temp_res.txt ]; then
              { echo -e "\n--- PROYECTO: $DIR_NAME (Mínimos OSV) ---\n"; cat temp_res.txt; } >> "$REPORT_PATH"
              VULNS_FOUND=true
            fi
          }
          
          # --- PARTE 2: INSTALACIÓN REAL ---
          uv export --all-groups --format requirements-txt --no-hashes > scan.txt 2>/dev/null || true
          if [ -s scan.txt ]; then
            pip-audit --vulnerability-service osv -r scan.txt --format columns > out_res.txt 2>/dev/null || true
            if grep -q "\---" out_res.txt; then
              { echo -e "\n--- PROYECTO: $DIR_NAME (Real Tree OSV) ---\n"; cat out_res.txt; } >> "$REPORT_PATH"
              VULNS_FOUND=true
            fi
          fi
          # Cifrado con la contraseña del secreto
          if [ "$VULNS_FOUND" = true ]; then
             echo "${{ secrets.AUDIT_PASSWORD }}" | gpg --quiet --batch --yes --symmetric --passphrase-fd 0 --pinentry-mode loopback "$REPORT_PATH"
             echo "found=true" >> $GITHUB_OUTPUT
          fi
      - name: Upload Encrypted Results
        if: steps.audit.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: "*.gpg"
          retention-days: 1

  # 3. Consolidación
  consolidate:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-results
          pattern: results-*
          merge-multiple: true

      - name: Decrypt and Merge
        env:
          AUDIT_PASS: ${{ secrets.AUDIT_PASSWORD }}
        run: |
          if [ -d "all-results" ] && [ "$(ls -A all-results)" ]; then
            echo "=== REPORTE CONSOLIDADO BAOBAB (MOTOR OSV) ===" > reporte_final.txt
            for f in all-results/*.gpg; do
              echo "$AUDIT_PASS" | gpg --quiet --batch --yes --decrypt --passphrase-fd 0 --pinentry-mode loopback "$f" >> reporte_final.txt
              echo -e "\n------------------------------------------\n" >> reporte_final.txt
            done
            echo "SEND_MAIL=true" >> $GITHUB_ENV
          fi
      - name: Send mail
        if: env.SEND_MAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🛡️ Alerta Seguridad Monorepo: Reporte Completo"
          to: ${{ secrets.MAIL_TO_SEND }}
          from: "GitHub Audit"
          body: "Se adjunta el reporte con el análisis de Mínimos y Real Tree para cada módulo."
          attachments: "reporte_final.txt"

      - name: Purge Artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: results-*
          useGlob: true